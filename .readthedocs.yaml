# Read the Docs build for the Python client reference (python/docs).
# Every path here is relative to the repository root, not to this file.
version: 2

build:
  os: ubuntu-24.04
  tools:
    # Sphinx 9 requires 3.13; the client itself still supports 3.10+.
    python: "3.13"

sphinx:
  configuration: python/docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: python/docs/requirements.txt
    # autodoc imports the package, so it has to be installed.
    - path: python
