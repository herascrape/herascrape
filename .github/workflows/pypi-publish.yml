name: Publish (PyPI)

# Publish a published, non-prerelease GitHub Release to PyPI via Trusted
# Publishing (OIDC, no token).
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/release-python-build.yml

  publish:
    name: publish to PyPI
    # Prereleases never publish.
    if: github.event.release.prerelease == false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/herascrape
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
