name: Publish (TestPyPI)

# Manual dry run: build the selected ref and publish it to TestPyPI via
# Trusted Publishing (OIDC, no token).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpypi-publish
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/release-python-build.yml

  publish:
    name: publish to TestPyPI
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/herascrape
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          attestations: true
